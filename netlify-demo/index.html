<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Nook Library Management System | Demo</title>
    <meta name="description" content="Book Nook - a library management system (PHP/MySQL) running as an in-browser demo." />
    <link rel="icon" type="image/png" href="assets/img/book-nook.png" />
    <link href="assets/css/bootstrap.css" rel="stylesheet" />
    <link href="assets/css/font-awesome.css" rel="stylesheet" />
    <link href="assets/css/style.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700&display=swap" rel="stylesheet" />
    <link href="assets/css/demo.css" rel="stylesheet" />

<body>
    <div class="demo-banner">
        <i class="fa fa-info-circle"></i>
        Portfolio demo: the original app is PHP + MySQL. This copy runs in your browser, and changes are saved on this device only.
        <a href="#" id="reset-demo">Reset demo data</a>
    </div>

    <div class="navbar navbar-inverse set-radius-zero">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                    <span class="icon-bar"></span><span class="icon-bar"></span><span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="#/">
                    <div class="logo-container"><img src="assets/img/book-nook.png" alt="Book Nook Logo" /></div>
                </a>
            </div>
            <div class="right-div" id="logout-slot"></div>
        </div>
    </div>

    <section class="menu-section">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <div class="navbar-collapse collapse">
                        <ul id="menu-top" class="nav navbar-nav navbar-right"></ul>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="content-wrapper">
        <div class="container" id="app"></div>
    </div>

    <section class="footer-section">
        <div class="container">
            <div class="row">
                <div class="col-md-12">&copy;Book Nook Library Management System</div>
            </div>
        </div>
    </section>

    <div id="toast" class="demo-toast" role="status" aria-live="polite"></div>

    <script src="assets/js/jquery-1.10.2.js"></script>
    <script src="assets/js/bootstrap.js"></script>
    <script src="assets/js/app.js"></script>

</html>
